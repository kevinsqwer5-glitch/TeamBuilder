<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0221">
  <title>Team Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="wrap">
    <header class="hero">
      <div class="badge">🍻 Trinkspiel-Edition</div>
      <h1>Team<span>Builder</span></h1>
      <p class="sub">Namen rein, Teams raus. Prost!</p>
    </header>

    <section class="panel" id="setup">
      <label for="player" class="label">Mitspieler</label>
      <form class="add" id="addForm" autocomplete="off">
        <input id="player" type="text" maxlength="40" placeholder="Name eingeben" enterkeyhint="done">
        <button type="submit" class="add-btn" aria-label="Spieler hinzufügen">+</button>
      </form>
      <ul class="players" id="players" aria-live="polite"></ul>
      <div class="meta"><span id="count">0 Mitspieler</span><button type="button" class="link" id="clear">Alle entfernen</button></div>

      <label for="size" class="label">Teilnehmer pro Team</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="weniger">−</button>
        <input id="size" type="number" min="1" max="50" value="2" inputmode="numeric">
        <button type="button" id="plus" aria-label="mehr">+</button>
      </div>
      <p class="hint" id="hint"></p>

      <button type="button" class="cta" id="build">Teams bilden 🎉</button>
      <p class="error" id="error" role="alert"></p>
    </section>

    <section id="result" class="result" hidden>
      <div class="result-head">
        <h2>Die Teams</h2>
        <div class="actions">
          <button type="button" class="ghost" id="reshuffle">🔀 Neu mischen</button>
          <button type="button" class="ghost" id="copy">📋 Kopieren</button>
          <button type="button" class="ghost" id="back">✏️ Bearbeiten</button>
        </div>
      </div>
      <div class="grid" id="teams"></div>
    </section>

    <footer class="foot">Bitte verantwortungsvoll trinken – Wasser zählt auch als Shot. 💧</footer>
  </main>

  <script src="js/teamnames.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
